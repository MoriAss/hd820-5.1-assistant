<path d="M312 621 L320 633 L328 621 Z" fill="#087f8c"/>
<text x="356" y="617" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="start" data-max-width="200">USB</text>
<rect x="64" y="652" width="512" height="106" rx="16" fill="#e6f5f2" stroke="#7fb9af" stroke-width="2"/>
<text x="320" y="694" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="480">HD820</text>
<text x="320" y="734" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#173247" text-anchor="middle" data-max-width="480">接收 AC3，解码为 5.1</text>
<text x="320" y="805" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle" data-max-width="576">六根 RCA 模拟音频线</text>
