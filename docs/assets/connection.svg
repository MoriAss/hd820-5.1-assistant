<text x="320" y="1279" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="152">SL 左环绕</text>
<rect x="428" y="1236" width="164" height="68" rx="10" fill="#ffffff" stroke="#a24c53" stroke-width="2"/>
<text x="510" y="1279" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="152">SR 右环绕</text>
<text x="320" y="1383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="576">RCA 按声道名称接线</text>
<text x="320" y="1420" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#466078" text-anchor="middle" data-max-width="576">颜色只用于区分示意线路</text>
