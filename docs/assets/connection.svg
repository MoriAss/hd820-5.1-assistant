<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1440" viewBox="0 0 640 1440" role="img" aria-labelledby="title desc">
<title id="title">HD820 5.1 接线图</title>
<desc id="desc">电脑内应用经过Voicemeeter和助手/FFmpeg，USB连接HD820，六根RCA按声道名称接入功放多声道模拟输入，再连接5.1音箱。所有方框均为示意，不代表硬件外观。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker></defs>
<rect width="640" height="1440" rx="20" fill="#f6f9fb"/>
<text x="32" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#173247" text-anchor="start" data-max-width="576">HD820 5.1 接线图</text>
<text x="32" y="96" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#466078" text-anchor="start" data-max-width="576">方框为连接示意，不代表设备外观</text>
<rect x="32" y="124" width="576" height="456" rx="16" fill="#eaf3f7" stroke="#c7d9e3" stroke-width="2"/>
<text x="64" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#173247" text-anchor="start" data-max-width="512">Windows 电脑内的软件链路</text>
<rect x="64" y="192" width="512" height="86" rx="16" fill="white" stroke="#c7d9e3" stroke-width="2"/>
<text x="320" y="227" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="480">游戏 / 音乐 / 浏览器</text>
<text x="320" y="263" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#466078" text-anchor="middle" data-max-width="480">应用需提供多声道音频</text>
<path d="M320 283 V302" fill="none" stroke="#087f8c" stroke-width="4"/>
<path d="M312 299 L320 311 L328 299 Z" fill="#087f8c"/>
<rect x="64" y="326" width="512" height="80" rx="16" fill="white" stroke="#c7d9e3" stroke-width="2"/>
<text x="320" y="360" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="480">Voicemeeter</text>
<text x="320" y="393" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#466078" text-anchor="middle" data-max-width="480">48 kHz · 5.1 入口</text>
<path d="M320 411 V430" fill="none" stroke="#087f8c" stroke-width="4"/>
<path d="M312 427 L320 439 L328 427 Z" fill="#087f8c"/>
<rect x="64" y="454" width="512" height="96" rx="16" fill="#ffffff" stroke="#8abac7" stroke-width="2"/>
<text x="320" y="493" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="480">HD820 5.1 助手</text>
<text x="320" y="533" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#466078" text-anchor="middle" data-max-width="480">FFmpeg：转成 AC3</text>
