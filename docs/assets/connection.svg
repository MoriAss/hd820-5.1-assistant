<text x="510" y="1191" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#173247" text-anchor="middle" data-max-width="152">C 中置</text>
<rect x="48" y="1236" width="164" height="68" rx="10" fill="#ffffff" stroke="#8d5aa8" stroke-width="2"/>
