name: Windows offline regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        shell: pwsh
        run: |
          python -m pip install -r tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
      - name: Build
        shell: powershell
        run: ./build.ps1 -OutputRoot ./dist
      - name: Offline tests
        shell: pwsh
        run: |
          python tests/run_tests.py --assembly './dist/HD820游戏5.1助手.exe' --output ./test-results/ci
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }
      - name: Package tested portable release
        shell: pwsh
        run: |
          $version = (Get-Item './dist/HD820游戏5.1助手.exe').VersionInfo.FileVersion -replace '\.0$',''
          python tools/package_release.py --version $version --validation ./test-results/ci/summary.json
          if ($LASTEXITCODE -ne 0) { throw 'Verified packaging failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: test-results/ci/
      - uses: actions/upload-artifact@v4
        with:
          name: hd820-5.1-assistant-windows-x64
          path: release/
